###
### /etc/skycharge.conf of the Skycharge digital twin (format: support.skycharge.de/docs/configuration-file)
###
### skycharged loads this file at every start and writes it to the boards, so a power cycle undoes
### whatever set-sink-params changed at runtime. LAAIRS restores its battery settings after
### connecting for that reason. The sink values below are the pad's fallback, not the CopterSonde pack.
###

### UUID of the user (the JSON API wants it as user-uuid); this is the public test UUID
user-uuid = 00000000-0000-0000-0000-000000000000

### URL of the broker server. The twin does not go online.
# broker-url = broker.skycharge.de:6666,5555

### UUID and short name of this device
device-uuid = 6b1e5f0e-6d43-4c1b-9a3e-c0b1e5500001
device-name = bolognini

mux-type = hw2
mux-dev = /dev/ttyS4

###
### Charge source (MUX HW2)
###
mux-hw2-psu-type = RSP-750-48
mux-hw2-detect-mode = capacity
mux-hw2-repeat-charge-after-mins = 10
mux-hw2-ignore-low-batt-voltage = true
mux-hw2-nr-bad-heartbeats = 20
mux-hw2-error-indication-timeout-secs = 5

###
### Charge sink, for the capacity detect mode
###
sink-batt-type = Li-Po
sink-batt-capacity-mah = 5000
sink-batt-max-voltage-mv = 25200
sink-batt-min-voltage-mv = 18000
sink-charging-max-current-ma = 10000
sink-cutoff-min-current-ma = 500
sink-cutoff-timeout-ms = 1000
sink-precharge-delay-secs = 1
sink-precharge-current-ma = 1000
sink-precharge-secs = 30
sink-total-charge-secs = 7200
